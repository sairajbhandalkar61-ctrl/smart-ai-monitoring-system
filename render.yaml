version: "1"
services:
  - type: web
    name: sentinel-ai-cloud
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /_stcore/health
    envVars:
      - key: APP_ENV
        value: production
      - key: IS_CLOUD
        value: "true"
      - key: PORT
        value: "8501"
      - key: DATABASE_URL
        fromDatabase:
          name: sentinel-postgres
          property: connectionString

databases:
  - name: sentinel-postgres
    plan: free
    region: oregon
    databaseName: sentinel_db
    user: sentinel_user
