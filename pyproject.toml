[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-ai"
version = "1.0.0"
description = "Real-Time Crowd Monitoring and Activity Classification System"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Sairaj Bhandalkar", email = "sairajbhandalkar61@gmail.com"}
]
keywords = [
    "computer-vision",
    "crowd-monitoring",
    "opencv",
    "object-tracking",
    "deep-learning",
    "activity-classification",
    "fastapi",
    "streamlit"
]
dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.5.0",
    "streamlit>=1.30.0",
    "joblib>=1.3.0",
    "pillow>=10.0.0",
    "onnxruntime>=1.16.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.0",
    "httpx>=0.27.0"
]
dl = [
    "tensorflow>=2.14.0",
    "torch>=2.1.0",
    "torchvision>=0.16.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hardware: tests requiring physical webcam or hardware devices",
    "slow: benchmarks or long-running end-to-end tests",
    "integration: tests verifying multi-component contracts"
]
addopts = "-ra -q --strict-markers"
